<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click2Cargo Logistics | Enterprise B2B Cold Chain Leasing</title>
    <style>
        :root { --primary-navy: #0A192F; --accent-orange: #FF6B35; --text-dark: #0A192F; }
        body { color: var(--text-dark); background-color: #F8FAFC; line-height: 1.6; }
        header { background: var(--primary-navy); color: white; padding: 20px; }
        .hero { text-align: center; padding: 50px; }
        .cta-btn { background: var(--accent-orange); color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        .grid-layout { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .info-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .edit-field { border: 1px dashed transparent; }
        .edit-field[contenteditable="true"] { border-color: var(--accent-orange); background: #FFFDE7; }
        .admin-login-box { text-align: center; padding: 20px; margin: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <header><h1>Click2<span>Cargo</span></h1></header>
    <main class="page-content active-page">
        <div class="hero">
            <h2 class="edit-field" id="hero-title">Premium Cold Chain Logistics</h2>
            <p class="edit-field" id="hero-desc">Sub-zero refrigerated transport solutions in Telangana.</p>
        </div>
        <div class="grid-layout">
            <div class="info-card"><h3 class="edit-field">Asset-Light</h3><p class="edit-field">Reefer provisioning.</p></div>
            <div class="info-card"><h3 class="edit-field">Zero Risk</h3><p class="edit-field">Maintenance-free.</p></div>
        </div>
    </main>
    <div class="admin-login-box" id="auth-box">
        <input type="password" id="pass-input" placeholder="Password"><button onclick="verifyOwner()">Login</button>
    </div>
    <script>
        function verifyOwner() {
            if(document.getElementById('pass-input').value === '2026') {
                document.querySelectorAll('.edit-field').forEach(f => f.setAttribute('contenteditable', 'true'));
            } else { alert('Invalid Password'); }
        }
    </script>
</body>
</html>
